name: pages

# Publishes the browser playground (site/) to GitHub Pages: bb site bundles
# the sources into one self-contained page, served as index.html.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install babashka
        run: |
          curl -sL -o bb.tar.gz \
            https://github.com/babashka/babashka/releases/download/v1.13.223/babashka-1.13.223-linux-amd64-static.tar.gz
          tar -xzf bb.tar.gz
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: ~/.m2
          key: bb-deps-${{ hashFiles('bb.edn', 'deps.edn') }}

      - name: Build the playground
        run: |
          bb site
          mkdir -p _site
          cp site/vendor/playground.html _site/index.html

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
